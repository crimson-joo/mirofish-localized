name: Local Runtime CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "services/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci.yml"
      - "docs/current/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read QA and release intent
        run: |
          test -f docs/current/qa.md
          test -f docs/current/release.md
          grep -q "ZEP-free" docs/current/release.md
          grep -q "Pages" docs/current/qa.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --dev
          uv run python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Docker Compose config
        run: docker compose --profile graphiti config >/tmp/compose.yml
