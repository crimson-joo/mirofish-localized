name: Local Runtime CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "services/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/ci.yml"
      - "docs/current/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read QA and release intent
        run: |
          test -f docs/current/qa.md
          test -f docs/current/release.md
          grep -q "ZEP-free" docs/current/release.md
          grep -q "Pages" docs/current/qa.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --dev
          uv run python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Docker Compose config
        run: docker compose --profile graphiti config >/tmp/compose.yml

      - name: Notify Hermes local runtime canary if configured
        if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && success() }}
        env:
          HERMES_LOCAL_RUNTIME_WEBHOOK_URL: ${{ secrets.HERMES_LOCAL_RUNTIME_WEBHOOK_URL }}
          HERMES_WEBHOOK_BASE_URL: ${{ secrets.HERMES_WEBHOOK_BASE_URL }}
          HERMES_LOCAL_RUNTIME_WEBHOOK_SECRET: ${{ secrets.HERMES_LOCAL_RUNTIME_WEBHOOK_SECRET }}
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          webhook_url="${HERMES_LOCAL_RUNTIME_WEBHOOK_URL:-}"
          if [ -z "$webhook_url" ] && [ -n "${HERMES_WEBHOOK_BASE_URL:-}" ]; then
            webhook_url="${HERMES_WEBHOOK_BASE_URL%/}/webhooks/mirofish-local-runtime-canary"
          fi
          if [ -z "$webhook_url" ]; then
            echo "No Hermes local-runtime webhook URL configured; skipping local runtime canary handoff."
            exit 0
          fi
          webhook_secret="${HERMES_LOCAL_RUNTIME_WEBHOOK_SECRET:-${HERMES_WEBHOOK_SECRET:-}}"
          export webhook_url webhook_secret
          node <<'NODE'
          const crypto = require('crypto');
          const body = JSON.stringify({
            event: 'local_runtime_ci_pass',
            repo: process.env.GITHUB_REPOSITORY,
            branch: process.env.GITHUB_REF_NAME,
            sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            frontend_url: 'http://127.0.0.1:3000/',
            backend_url: 'http://127.0.0.1:5001',
            canary_scripts: ['scripts/local-runtime-browser-canary.mjs', 'scripts/report-locale-e2e.py'],
          });
          const headers = {
            'content-type': 'application/json',
            'user-agent': 'mirofish-local-runtime-github-actions',
            'x-github-event': 'local_runtime_ci_pass',
          };
          if (process.env.webhook_secret) {
            headers['x-hub-signature-256'] = 'sha256=' + crypto
              .createHmac('sha256', process.env.webhook_secret)
              .update(body)
              .digest('hex');
          }
          (async () => {
            const response = await fetch(process.env.webhook_url, { method: 'POST', headers, body });
            const text = await response.text();
            console.log(`Hermes local runtime webhook response: ${response.status} ${text}`);
            if (!response.ok) process.exit(1);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
