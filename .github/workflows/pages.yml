name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/pages/**"
      - "docs/current/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release/canary intent
        run: |
          test -f docs/current/qa.md
          test -f docs/current/release.md
          grep -q "GitHub Pages" docs/current/release.md
          grep -q "Pages Canary" docs/current/qa.md

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R docs/pages/. _site/
          cp docs/current/qa.md _site/qa.md
          cp docs/current/release.md _site/release.md
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  canary:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Run post-deploy scripted canary
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGE_URL:-https://crimson-joo.github.io/mirofish-localized/}"
          cache_busted="${url}?canary=${GITHUB_RUN_ID}-${GITHUB_SHA}"
          for target in "$url" "$cache_busted"; do
            echo "CANARY checking $target"
            curl -fsSL "$target" -o page.html
            grep -qi "ZEP-free" page.html
            grep -qi "Graphiti" page.html
            grep -qi "Local quickstart" page.html
            grep -qi "정적 확인/문서 페이지" page.html
          done
          echo "CANARY PASS $url"

      - name: Set up Node for browser canary
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Run live browser canary
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p canary-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const url = process.env.PAGE_URL || 'https://crimson-joo.github.io/mirofish-localized/';
          const cacheBusted = `${url}?browser_canary=${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_SHA}`;
          const required = ['ZEP-free', 'Graphiti', 'Local quickstart', '정적 확인/문서 페이지'];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 1200 } });
            const consoleErrors = [];
            page.on('console', msg => {
              if (['error'].includes(msg.type())) consoleErrors.push(msg.text());
            });
            page.on('pageerror', err => consoleErrors.push(err.message));
            for (const target of [url, cacheBusted]) {
              const response = await page.goto(target, { waitUntil: 'networkidle', timeout: 60000 });
              if (!response || !response.ok()) throw new Error(`navigation failed ${target} status=${response && response.status()}`);
              const text = await page.locator('body').innerText({ timeout: 15000 });
              for (const marker of required) {
                if (!text.includes(marker)) throw new Error(`missing live marker ${marker} at ${target}`);
              }
            }
            await page.screenshot({ path: 'canary-artifacts/pages-live-canary.png', fullPage: true });
            await browser.close();
            fs.writeFileSync('canary-artifacts/pages-live-canary.json', JSON.stringify({ url, cacheBusted, required, consoleErrors }, null, 2));
            if (consoleErrors.length) throw new Error(`browser console errors: ${consoleErrors.join('\n')}`);
            console.log(`BROWSER CANARY PASS ${url}`);
          })().catch(async err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-canary
          path: canary-artifacts/
          if-no-files-found: ignore

      - name: Notify Hermes webhook if configured
        env:
          HERMES_WEBHOOK_URL: ${{ secrets.HERMES_WEBHOOK_URL }}
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "${HERMES_WEBHOOK_URL:-}" ]; then
            echo "HERMES_WEBHOOK_URL is not set; skipping Hermes webhook notification."
            exit 0
          fi
          node <<'NODE'
          const crypto = require('crypto');
          const payload = {
            event: 'pages_canary_pass',
            repo: process.env.GITHUB_REPOSITORY,
            sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            page_url: process.env.PAGE_URL,
            qa_docs: ['docs/current/qa.md', 'docs/current/release.md'],
          };
          const body = JSON.stringify(payload);
          const headers = {
            'content-type': 'application/json',
            'user-agent': 'mirofish-pages-github-actions',
            'x-github-event': payload.event,
          };
          if (process.env.HERMES_WEBHOOK_SECRET) {
            headers['x-hub-signature-256'] = 'sha256=' + crypto
              .createHmac('sha256', process.env.HERMES_WEBHOOK_SECRET)
              .update(body)
              .digest('hex');
          }
          (async () => {
            const response = await fetch(process.env.HERMES_WEBHOOK_URL, { method: 'POST', headers, body });
            const text = await response.text();
            console.log(`Hermes webhook response: ${response.status} ${text}`);
            if (!response.ok) process.exit(1);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
