services:
  mirofish:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mirofish-localized
    environment:
      # Default local-first/ZEP-free runtime. Override in .env for hosted or local OpenAI-compatible endpoints.
      LLM_API_KEY: ${LLM_API_KEY:-dummy}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:10531/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-5.5}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_BOOST_API_KEY: ${LLM_BOOST_API_KEY:-}
      LLM_BOOST_BASE_URL: ${LLM_BOOST_BASE_URL:-}
      LLM_BOOST_MODEL_NAME: ${LLM_BOOST_MODEL_NAME:-}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
      GRAPH_PROVIDER: ${GRAPH_PROVIDER:-graphiti}
      LOCAL_GRAPH_STORAGE_DIR: ${LOCAL_GRAPH_STORAGE_DIR:-/app/backend/uploads/local_graphs}
      # Inside compose, MiroFish talks to bundled Graphiti by service name; no host Graphiti is required.
      GRAPH_MEMORY_BASE_URL: ${GRAPH_MEMORY_BASE_URL:-http://graph-memory:8000}
      GRAPHITI_BASE_URL: ${GRAPHITI_BASE_URL:-http://graph-memory:8000}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://localhost:5001}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local-no-auth}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8089/v1}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-jina-embeddings-v5-small}
      # Multimodal is optional. For Apple-MLX Ollama models, run Ollama on the Mac host and use host.docker.internal.
      MULTIMODAL_API_KEY: ${MULTIMODAL_API_KEY:-}
      MULTIMODAL_BASE_URL: ${MULTIMODAL_BASE_URL:-http://host.docker.internal:11434/v1}
      MULTIMODAL_MODEL_NAME: ${MULTIMODAL_MODEL_NAME:-gemma4:12b-mlx}
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - mirofish_local_graphs:/app/backend/uploads/local_graphs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      graph-memory:
        condition: service_started

  # Bundled Graphiti/Neo4j product runtime. UI graph panels use an internal projection cache,
  # not a fallback provider. This starts with plain `docker compose up`.
  graph-memory:
    build:
      context: ./services/graphiti-patched
    image: mirofish-localized-graphiti:local
    environment:
      OPENAI_API_KEY: ${GRAPH_MEMORY_OPENAI_API_KEY:-${LLM_API_KEY:-dummy}}
      OPENAI_BASE_URL: ${GRAPH_MEMORY_OPENAI_BASE_URL:-${LLM_BASE_URL:-http://host.docker.internal:10531/v1}}
      # Default to the same OpenAI-compatible local GPT auth model used by the app container;
      # override in .env for Ollama/LM Studio/vLLM/etc.
      MODEL_NAME: ${GRAPH_MEMORY_MODEL_NAME:-${LLM_MODEL_NAME:-gpt-5.5}}
      # Optional: point Graphiti's small-model extraction pass at a stricter structured-output model.
      GRAPH_MEMORY_SMALL_MODEL_NAME: ${GRAPH_MEMORY_SMALL_MODEL_NAME:-${GRAPH_MEMORY_MODEL_NAME:-${LLM_MODEL_NAME:-gpt-5.5}}}
      EMBEDDING_MODEL_NAME: ${GRAPH_MEMORY_EMBEDDING_MODEL_NAME:-${EMBEDDING_MODEL_NAME:-jina-embeddings-v5-small}}
      EMBEDDING_BASE_URL: ${GRAPH_MEMORY_EMBEDDING_BASE_URL:-${EMBEDDING_BASE_URL:-http://host.docker.internal:8089/v1}}
      EMBEDDING_API_KEY: ${GRAPH_MEMORY_EMBEDDING_API_KEY:-${EMBEDDING_API_KEY:-local-no-auth}}
      EMBEDDING_DIM: ${GRAPH_MEMORY_EMBEDDING_DIM:-1024}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mirofish_local_password}
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mirofish_local_password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Optional Linux-container Ollama. Use a non-MLX model tag here.
  # `gemma4:12b-mlx` is intended for Ollama on the Apple host, not the Linux Docker container.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Optional helper for bundled Ollama users. Example:
  #   OLLAMA_MULTIMODAL_MODEL=gemma4:12b docker compose --profile ollama up ollama-pull
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    entrypoint: ["/bin/sh", "-lc"]
    command: "ollama pull ${OLLAMA_MULTIMODAL_MODEL:-gemma4:12b}"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    restart: "no"

volumes:
  mirofish_local_graphs:
  neo4j_data:
  neo4j_logs:
  ollama_data:
