services:
  mirofish:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mirofish-localized
    environment:
      # Default local-first/ZEP-free runtime. Override in .env if you still want Zep Cloud.
      LLM_API_KEY: ${LLM_API_KEY:-dummy}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:10531/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-5.5}
      LLM_BOOST_API_KEY: ${LLM_BOOST_API_KEY:-}
      LLM_BOOST_BASE_URL: ${LLM_BOOST_BASE_URL:-}
      LLM_BOOST_MODEL_NAME: ${LLM_BOOST_MODEL_NAME:-}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
      GRAPH_PROVIDER: ${GRAPH_PROVIDER:-graphiti}
      LOCAL_GRAPH_STORAGE_DIR: ${LOCAL_GRAPH_STORAGE_DIR:-/app/backend/uploads/local_graphs}
      GRAPH_MEMORY_BASE_URL: ${GRAPH_MEMORY_BASE_URL:-http://graph-memory:8000}
      GRAPHITI_BASE_URL: ${GRAPHITI_BASE_URL:-http://graph-memory:8000}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://localhost:5001}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      MULTIMODAL_BASE_URL: ${MULTIMODAL_BASE_URL:-}
      MULTIMODAL_MODEL_NAME: ${MULTIMODAL_MODEL_NAME:-}
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - mirofish_local_graphs:/app/backend/uploads/local_graphs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Graphiti/Neo4j is the only local product runtime. UI graph panels use an
  # internal projection cache, not a fallback provider.
  graph-memory:
    build:
      context: ./services/graphiti-patched
    image: mirofish-localized-graphiti:local
    profiles: ["graphiti"]
    environment:
      OPENAI_API_KEY: ${GRAPH_MEMORY_OPENAI_API_KEY:-dummy}
      OPENAI_BASE_URL: ${GRAPH_MEMORY_OPENAI_BASE_URL:-http://host.docker.internal:10531/v1}
      # Default to the same OpenAI-compatible local GPT auth model used by the
      # app container on this machine; override in .env for Ollama/LM Studio/etc.
      MODEL_NAME: ${GRAPH_MEMORY_MODEL_NAME:-gpt-5.5}
      # Optional: point Graphiti's small-model extraction pass at a stricter
      # structured-output model without changing the app-facing LLM.
      GRAPH_MEMORY_SMALL_MODEL_NAME: ${GRAPH_MEMORY_SMALL_MODEL_NAME:-gpt-5.5}
      EMBEDDING_MODEL_NAME: ${GRAPH_MEMORY_EMBEDDING_MODEL_NAME:-jina-embeddings-v5-small}
      EMBEDDING_BASE_URL: ${GRAPH_MEMORY_EMBEDDING_BASE_URL:-http://host.docker.internal:8089/v1}
      EMBEDDING_API_KEY: ${GRAPH_MEMORY_EMBEDDING_API_KEY:-local-no-auth}
      EMBEDDING_DIM: ${GRAPH_MEMORY_EMBEDDING_DIM:-1024}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mirofish_local_password}
    ports:
      - "8000:8000"
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5.26-community
    profiles: ["graphiti", "neo4j"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mirofish_local_password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mirofish_local_graphs:
  neo4j_data:
  neo4j_logs:
  ollama_data:
